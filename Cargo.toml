[package]
name = "typst2pptx"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.94"
image = { version = "0.25.4", default-features = false, features = ["png"] }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
time = "0.3"
tar = "0.4"
ttf-parser = "0.25"
ureq = "3.4.2"
zune-inflate = { version = "0.2", default-features = false, features = [
  "gzip",
  "std",
] }
# Must match the usvg version used by Typst’s SVG image trees.
resvg = "0.47"
dirs = "7.0.0"
