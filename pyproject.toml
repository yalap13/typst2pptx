[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "typst2pptx"
version = "0.1.0"
description = "Convert Typst documents into PowerPoint presentations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
]

[project.scripts]
typst2pptx = "typst2pptx.cli:main"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
